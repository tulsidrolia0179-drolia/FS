name: Build Executable

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas pyinstaller customtkinter openpyxl xlsxwriter

    - name: Build Executable
      run: |
        pyinstaller --onefile --collect-all customtkinter --hidden-import openpyxl --hidden-import xlsxwriter financial_statement_automator.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FinancialStatementAutomator
        path: dist/financial_statement_automator.exe
