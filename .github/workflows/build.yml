name: Build Python App

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        # If your script uses other libraries, add them here. Example: pip install requests pandas

    - name: Build with PyInstaller
      run: pyinstaller --onefile --noconsole financial_statement_automator_(1)_(1).py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: My-Windows-App
        path: dist/*.exe
